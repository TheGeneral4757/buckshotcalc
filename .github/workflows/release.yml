name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check the wheel ships rules.toml
        # The solver is only as correct as rules.toml, and it is loaded from
        # inside the package at runtime — a wheel without it installs fine and
        # then fails on first use.
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          if "buckshotcalc/rules.toml" not in names:
              sys.exit("rules.toml missing from the wheel")
          print("ok:", wheel)
          PY

      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "from buckshotcalc.engine.rules import default_rules; print('rules load ok:', default_rules().schema_version)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
