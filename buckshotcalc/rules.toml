# BuckshotCalc — Game Rules Configuration
# BuckshotCalc — authoritative game constants. MIT licensed; see LICENSE.
#
# AUTHORITATIVE SOURCE OF TRUTH for all game-dependent values.
# The solver's output is only ever as correct as this file.
#
# Every entry carries a confidence level:
#   VERIFIED - multiple independent sources agree
#   LIKELY   - single credible source, no contradiction found
#   ASSUMED  - our default, unconfirmed; see SPEC.md section 15
#
# Engine code MUST NOT hardcode anything that appears here.

schema_version = 1

# ---------------------------------------------------------------------------
# Shell loading
# ---------------------------------------------------------------------------

[shells]
min_total = 2                          # VERIFIED
max_total = 8                          # VERIFIED
min_live = 1                           # VERIFIED - always at least one of each
min_blank = 1                          # VERIFIED
even_total_splits_equally = true       # VERIFIED - even total => equal live/blank
odd_total_differs_by_one = true        # VERIFIED - odd total => exactly one extra
# VERIFIED (_ref/buckshotroulette RoundManager.gd:148-150, GenerateRandomBatches, run when
# `endless` is set, i.e. Double or Nothing; SetupRoundArray RoundManager.gd:161):
#   total = randi_range(2, 8); live = max(1, total / 2); blank = total - live
# so an odd total ALWAYS gives the extra shell to blank (3 -> 1L/2B, never 2L/1B).
# "blank" | "live" | "either" (50/50, our earlier assumption).
odd_total_extra_shell = "blank"

# ---------------------------------------------------------------------------
# Health
# ---------------------------------------------------------------------------

[health]
possible_max_hp = [2, 3, 4]            # VERIFIED
equal_for_both_players = true          # VERIFIED
resets_on_new_round = true             # VERIFIED
carries_through_reload = true          # VERIFIED - health phase skipped on reload

# ---------------------------------------------------------------------------
# Items - global
# ---------------------------------------------------------------------------

[items]
max_slots = 8                          # VERIFIED - cannot receive more at 8
dealt_per_round_min = 2                # VERIFIED
dealt_per_round_max = 5                # VERIFIED

# Item sets by mode. Heads-up multiplayer excludes expired_medicine (vaulted)
# and remote (requires 3+ players).
base_items = ["cigarettes", "handcuffs", "beer", "handsaw", "magnifying_glass"]
double_or_nothing_items = ["adrenaline", "expired_medicine", "burner_phone", "inverter"]
multiplayer_items = ["adrenaline", "burner_phone", "inverter", "remote"]

# ---------------------------------------------------------------------------
# Item semantics
# ---------------------------------------------------------------------------

[items.cigarettes]
heal = 1                               # VERIFIED
usable_at_max_hp = true                # VERIFIED - consumes slot, no effect
retains_turn = true

[items.handcuffs]
skips_opponent_turns = 1               # VERIFIED
stackable_on_cuffed_target = false     # VERIFIED - operator-confirmed
clears_at_end_of_round = true          # VERIFIED
retains_turn = true

[items.beer]
ejects_chambered_shell = true          # VERIFIED
reveals_ejected_shell = true           # VERIFIED - revealed as it ejects
# VERIFIED (_ref/buckshotroulette ItemInteraction.gd:130-141 beer branch never touches
# barrelSawedOff; only SegmentManager.gd:14-17 GrowBarrel resets it, via RoundManager.gd:264-273
# EndTurn after a shot). Beer does NOT clear the saw: saw then beer keeps the saw.
clears_sawed = false
retains_turn = true

[items.handsaw]
damage = 2                             # VERIFIED - replaces base damage of 1
# VERIFIED (SegmentManager.gd:14-17 GrowBarrel, reached only from RoundManager.gd:264-273
# EndTurn, which every shot calls: ShotgunShooting.gd:192, DealerIntelligence.gd:348):
# reverts once the chambered shell is FIRED. Beer ejecting does not revert it, so saw then beer
# keeps the saw for the next shot of the same turn. It does NOT persist across turns
# (a shot always passes through EndTurn). Exception: beer ejecting the LAST shell calls
# StartRound(true) directly (ItemInteraction.gd:140-141), skipping EndTurn, so the saw would
# carry into the next load; not modelled, see SPEC.md 15.14.
consumed_on = ["shot_fired"]
persists_across_turns = false
stackable = false                      # cannot saw an already-sawed barrel
retains_turn = true

[items.magnifying_glass]
reveals_slot = 0                       # VERIFIED - the chambered shell
retains_turn = true

[items.adrenaline]
steals_opponent_item = true            # VERIFIED
uses_stolen_item_immediately = true    # VERIFIED
can_steal_adrenaline = false           # VERIFIED
# VERIFIED - no rack check anywhere: ItemInteraction.gd:177-181 always runs
# SetupItemSteal (ItemManager.gd:399); the Adrenaline is already consumed
# (ItemInteraction.gd:105-110). With nothing stealable (empty rack, or only
# Adrenaline / an item invalid at the time, PermissionManager.gd:65-70) the
# 7s steal timer (ItemManager.gd:470-480, not gated on timeouts_enabled) runs
# out and RevertItemSteal_Timeout (ItemManager.gd:439-455) hands the turn
# back. Costs only the Adrenaline; no per-turn limit exists in the game.
usable_with_nothing_to_steal = true
expiry_seconds = 7                     # VERIFIED ItemManager.gd:470 (7.0 s steal timer) - not modeled
retains_turn = true

[items.expired_medicine]
heal = 2                               # VERIFIED
harm = 1                               # VERIFIED
# VERIFIED for the current build - observed behaviour:
# `if (medicine_outcome < .5): dying = false`. NOTE: an older v1.2
# another analysis of the same game reported 40/60 instead, i.e. this value has
# drifted across a patch before. rules.toml is version-sensitive here and
# should be re-checked against new game releases, not assumed stable.
heal_probability = 0.5
can_be_lethal = true                   # the -1 may reduce HP to 0 and lose the round
retains_turn = true

[items.burner_phone]
reveals_future_shell = true            # VERIFIED - never the chambered shell
excludes_slot = 0                      # VERIFIED
# VERIFIED (_ref/buckshotroulette BurnerPhone.gd:14-16): the PLAYER's phone draws
# randindex = randi_range(1, len-1) and then `if (randindex == 8 or randindex == 7):
# randindex -= 1`, so any drawn index >= 7 is shifted down by one. With at most 8
# shells that is 7 -> 6: slot 6 is twice as likely as slots 1..5 and slot 7 is never
# revealed once 8 shells remain. The Dealer's phone is uniform apart from 8 -> 7
# (DealerIntelligence.gd:187-190) and is NOT affected by this key (decisions-pending 10).
player_index_decrement_from = 7
stacks = true                          # VERIFIED - multiple phones reveal more
# VERIFIED: the phone's recorded targets are held alongside the chamber and are
# dropped in lockstep with the chamber, i.e. index is RELATIVE to the
# current position and ejecting a shell shifts it. The sequence model in
# SPEC.md section 5 handles this automatically.
index_is_relative = true
retains_turn = true

[items.inverter]
inverts_chambered_shell = true         # VERIFIED
# Inverting an UNRESOLVED shell is a chance node, not a flip - see SPEC.md 5.2.
# It resolves the slot AND decrements the pool, changing the odds of every
# remaining shell. A counts-only implementation cannot express this.
resolves_slot_on_use = true
retains_turn = true

[items.remote]
reverses_turn_order = true             # VERIFIED
min_players = 3                        # VERIFIED - useless heads-up
retains_turn = true

# ---------------------------------------------------------------------------
# Which mode this file's Dealer AI targets (correctness-patch item 1)
# ---------------------------------------------------------------------------

# VERIFIED - operator-confirmed: v1 targets Double or Nothing (the game calls
# this "endless"). Read only by `Rules.is_endless` (engine/rules.py) to gate
# the two Dealer AI branches observation shows are
# the endless-mode flag-conditioned: the majority-rule shot target below, and
# the count-closure deduction in `engine/dealer.py::dealer_view`. This is
# DISTINCT from the per-solver `GameMode` argument (which only selects a
# reload draw's item list, SPEC.md 3.2/7.4) - this is a static declaration of
# what the operator actually plays, not a per-call parameter, because
# `dealer.py`'s functions have only ever taken a loaded `Rules` object.
[mode]
mode = "double_or_nothing"

# ---------------------------------------------------------------------------
# The Dealer's deterministic policy
# ---------------------------------------------------------------------------

[dealer]
# What the Dealer knows. It does NOT cheat and does NOT see the shell order.
knows_shell_after_own_magnifying_glass = true    # VERIFIED
# VERIFIED, and NOT gated by [mode] - a single remaining shell is knowable in
# both endless and the base campaign (unlike the general count-closure
# deduction gated by `dealer.py`'s `rules.is_endless`, below).
knows_shell_when_one_remains = true
learns_from_player_item_use = false              # VERIFIED - it does not "hear" your info

# Shooting decision when the chambered shell is UNKNOWN ("majority rule").
# VERIFIED by observation - and confirmed as the endless-mode flag-
# gated: in the base campaign the Dealer is count-blind and flips a fair coin
# regardless of the live/blank split. `rules.is_endless` (mode, above) gates
# this in `engine/dealer.py::_shot_distribution`. Unconditional today only
# because v1's shipped mode is double_or_nothing.
unknown_shell_more_live_shoots_player = true
unknown_shell_more_blank_shoots_self = true
unknown_shell_equal_coinflip = 0.5

# Item usage conditions. Each is an IF AND ONLY IF.
always_uses_handcuffs = true                     # VERIFIED
# VERIFIED - it fires when the player is not already cuffed AND more than
# one shell remains; size = shells
# remaining in the chamber, chambered one included. Handcuffs never fire on
# the last shell.
handcuffs_requires_min_shells_remaining = 2
uses_cigarettes_below_max_hp = true              # VERIFIED
medicine_requires_below_max_hp = true            # VERIFIED
medicine_requires_hp_at_least = 2                # VERIFIED - never risks self-kill
# VERIFIED - the condition includes "holds no cigarettes". The Dealer will not
# use expired medicine while it holds any cigarettes at all.
medicine_requires_no_cigarettes_held = true
uses_handsaw_only_when_shooting_player = true    # VERIFIED
uses_beer_when_knows_blank_or_not_knows_live = true   # VERIFIED
# VERIFIED - it fires when the Dealer does not know the shell is live AND
# more than one shell remains. Beer never
# fires on the last shell.
beer_requires_min_shells_remaining = 2
# VERIFIED (_ref/buckshotroulette DealerIntelligence.gd:100-104/111/157 set dealerTarget = "self"
# from a known blank; the beer branch :170-175 clears knownShell/dealerKnowsShell (endless only)
# but NOT dealerTarget; the recursive DealerChoice :96-105 re-derives it only if the NEW shell
# is knowable (count closure, size 1) and a glass or the handsaw coin-flip :206-216 overwrites it;
# otherwise :275-276 Shoot(dealerTarget) fires "self" at the next, unknown, shell). Gated on
# `mode.mode = "double_or_nothing"` like the other endless-only branches.
beer_keeps_known_blank_target = true
uses_inverter_only_when_knows_blank = true       # VERIFIED - flips it live to shoot you
adrenaline_requires_wanted_item_not_held = true  # VERIFIED

# VERIFIED - it fires when the Dealer does not already know the chambered
# shell AND more than one shell remains.
uses_glass_when_chambered_shell_unknown = true
# VERIFIED - the size guard above. Arguably moot on its own (at size == 1 the
# Dealer already knows the shell via `knows_shell_when_one_remains`, so
# "the Dealer does not know the shell" is already false) but implemented
# anyway so the two
# conditions are not coupled by accident.
glass_requires_min_shells_remaining = 2

# VERIFIED by observation - supersedes the previous ASSUMED
# `uses_burner_phone_when_future_shell_unknown` default (SPEC.md 15.8), which
# was wrong: the real condition has nothing to do with whether a future slot
# is unresolved. Verbatim: `size > 2`.
burner_phone_min_shells_remaining = 3

# ASSUMED - SPEC.md 3.3 conditions the Dealer's adrenaline on the player holding
# "an item it wants", without defining what it wants. Default: it wants item X
# iff X is not adrenaline, it does not already hold X, and X's own dealer usage
# condition would currently fire. See SPEC.md 15.10.
adrenaline_wants_item_with_satisfied_condition = true   # ASSUMED

# DOCUMENTED and known to be structurally inexpressible, not merely ASSUMED -
# see SPEC.md 15.2. The real Dealer walks its item rack in *array order*
# (deal order) and fires the first slot whose type-condition holds - a single
# `if` per iteration, so holding [cigarettes, glass] uses cigarettes while
# [glass, cigarettes] uses the glass. Reproducing this exactly needs rack
# order modelled as Dealer state, which v1 does not carry (see
# docs/decisions-pending.md). This fixed list is a deliberate, accepted
# approximation for v1, not a placeholder for an unknown priority.
item_priority = [
  "handcuffs",
  "cigarettes",
  "expired_medicine",
  "magnifying_glass",
  "burner_phone",
  "beer",
  "adrenaline",
  "inverter",
  "handsaw",
]

# ---------------------------------------------------------------------------
# Turn and round mechanics
# ---------------------------------------------------------------------------

[turns]
player_moves_first = true              # VERIFIED - first-move advantage every load
blank_self_shot_retains_turn = true    # VERIFIED - repeatable indefinitely
live_self_shot_ends_turn = true        # VERIFIED
shooting_opponent_ends_turn = true     # VERIFIED - regardless of outcome
base_damage = 1                        # VERIFIED

[round]
campaign_rounds_to_win = 3             # VERIFIED - 3 consecutive
double_or_nothing_zero_hp_ends_run = true        # VERIFIED
player_moves_first_after_reload = true  # VERIFIED - SPEC.md 15.11. The
                                       # round-start routine runs
                                       # unconditionally on reload and health is
                                       # untouched.
cuffs_clear_on_reload = true           # VERIFIED - SPEC.md 15.12. Observed:
                                       # source: cuffs clear at the START of
                                       # EVERY load, not merely "end of round" -
                                       # stronger than our earlier phrasing, but
                                       # the same boolean outcome. Keeps
                                       # V_reload keyed on health alone (7.4).

# ---------------------------------------------------------------------------
# Solver tuning - ours, not the game's
# ---------------------------------------------------------------------------

[solver]
max_items_per_turn = 6                 # ASSUMED - guards the adrenaline chain.
                                       # When this cap binds the UI MUST warn.
# Stop the sweep when the largest entry change falls below this. Set against
# the table's own sampling error (+/-0.0067 at 64 draws), not below it: 1e-3
# leaves the iteration's contribution ~13x under the noise that dominates the
# result either way, and reaches it in 7 sweeps instead of 12. See
# docs/decisions-pending.md item 11 for the measured residual trace.
reload_fixedpoint_tolerance = 1e-3
reload_table_cache = true
redraw_budget_ms = 16

# Reload fixed point (7.4). Shell configurations are enumerated exactly; item
# draws are sampled, so these two govern cost against accuracy. Both are ours,
# not the game's - changing them changes the answer's precision, never its rules.
reload_item_draw_samples = 64          # deterministic; seeded from the rules fingerprint
reload_max_iterations = 64             # hard stop if the fixed point misbehaves (7.4)

# Worker processes for the reload sweep (7.7 item 1). The sweep's keys are
# independent, so this changes cost and nothing else - serial and parallel
# tables are asserted bit-for-bit identical. -1 = auto (every visible core);
# 0 or 1 = serial; n = exactly n workers. Auto is the default because this is
# a one-time offline precompute whose result is cached to disk, not
# interactive work sharing the machine with anything latency-sensitive.
reload_workers = -1

# Aitken (delta-squared) extrapolation of the sweep's linearly converging
# residual (7.7, docs/decisions-pending.md 13c): stops in fewer sweeps. The
# stop test is still the true residual of a plain sweep, so the table lands
# within the tolerance of the plain iteration. false = plain iteration.
reload_aitken = true

# Warm start (docs/decisions-pending.md 12 / 13d): seed the sweep from a
# converged table built with this many draw samples, cached separately under
# fingerprint+samplesN, instead of the health ratio. Within the tolerance of
# the plain iteration. 0 = off; ignored unless below reload_item_draw_samples.
reload_warm_start_samples = 4
